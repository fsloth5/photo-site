<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>G.C. Photography | Albums</title>
	<link href="/styles.css" rel="stylesheet">
</head>

<body>
	<!-- Content -->
	<div id="album-page-content" class="stretched-height margin-bt-sm no-select">

		<dialog id="photo-modal">
			<div class="vbox centered-main box-spacing-sm no-select padding-sm">
				<!-- Image -->
				<img class="flexbox-res-img fade add-fade-out" src="/resources/series.webp" alt="">

				<img data-show-hq="false" id="hq-icon" class="icon align-end squish"
					src="/resources/hq.svg" alt="Show high quality version">

				<h2 class="center-txt">Caption</h2>

				<!-- Image Props -->
				<div class="hbox centered-main box-spacing-sm padding-sm">
					<div class="hbox centered-cross box-spacing-xxs">
						<img class="icon" src="/resources/shutter-speed.svg"
							alt="Camera shutter speed">
						<h3>1/200</h3>
					</div>
					<div class="hbox centered-cross box-spacing-xxs">
						<img class="icon" src="/resources/aperture.svg" alt="Camera aperture">
						<h3>f/1.8</h3>
					</div>

					<div class="flex-one margin-m"></div>

					<div class="hbox centered-cross box-spacing-xxs">
						<img class="icon" src="/resources/iso.svg" alt="Camera iso">
						<h3>800</h3>
					</div>
					<div class="hbox centered-cross box-spacing-xxs">
						<img class="icon" src="/resources/focal-length.svg"
							alt="Camera focal length">
						<h3>18mm</h3>
					</div>
				</div>
			</div>
		</dialog>

		<!-- Header -->
		<div class="hbox centered-main centered-cross w100 padding-lr-175 fade header">
			<div id="header-text" class="hbox centered-cross box-spacing-sm no-wrap">
				<img src="/resources/logo.svg" alt="The comany's logo" width="32" height="32">
				<h1 id="contact-pg-bname" class="font-size-m">G.C. Photography</h1>
			</div>

			<div class="flex-one margin-m"></div>

			<!-- Indicator -->
			<div id="indicator" class="hbox centered-main box-spacing-m">
				<div class="vbox center-main">
					<h2 id="indicator-text" class="fade-in-text font-size-xl font-weight-n squish">
						Albums
					</h2>
					<div class="hbox centered-main centered-cross box-spacing-xs align-start">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
							fill="currentColor"
							class="display-none rotate-180 animated cursor-point icon">
							<path
								d="M4 11v2h12l-5.5 5.5 1.42 1.42L19.84 12l-7.92-7.92L10.5 5.5 16 11H4z" />
						</svg>

						<h3 id="album-name"
							class="font-size-s font-weight-n add-fade-out no-wrap">
						</h3>
					</div>
				</div>

				<div class="vbox box-spacing-sm">
					<svg class="collapsible" width="15" height="15" fill="none" stroke="black"
						xmlns="http://www.w3.org/2000/svg">
						<ellipse cx="7.5" cy="7.5" rx="7.5" ry="7.5" />
					</svg>
					<svg class="collapsible" width="15" height="15" fill="none" stroke="black"
						xmlns="http://www.w3.org/2000/svg">
						<ellipse cx="7.5" cy="7.5" rx="7.5" ry="7.5" />
					</svg>
					<svg id="indicator-active" width="15" height="15"
						xmlns="http://www.w3.org/2000/svg">
						<ellipse cx="7.5" cy="7.5" rx="7.5" ry="7.5" />
					</svg>
				</div>
			</div>

			<div class="flex-one header-bspacer margin-l"></div>
		</div>


		<div class="vbox centered-main centered-cross stretched-height box-spacing-m padding-m">
			<!-- AlbumThumbnails -->
			<div id="album-thumbnails" class="photo-wall center-self">
			</div>
		</div>
	</div>
	<script src="/index.js">
	</script>
</body>

</html>
