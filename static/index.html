<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>G.C. Photography</title>
	<link href="/styles.css" rel="stylesheet">
</head>

<body>
	<!-- Content -->
	<div class="stretched-height margin-bt-sm">
		<div id="home-page-content" class="vbox centered-cross stretched-height no-select">
			<div class="hbox centered-cross box-spacing-sm align-start fade">
				<img src="/resources/logo.svg" alt="The comany's logo" width="32" height="32">
				<h1 class="font-size-m">G.C. Photography</h1>
			</div>

			<!-- Image -->
			<img id="welcome-img" class="flexbox-res-img fade add-fade-out pos-rel"
				src="/resources/main.webp" alt="A portrait of a woman">

			<div id="scale-welcome-text" class="vbox">
				<p class="fade delayed delay1_5 center-txt">Those moments that often times
					get
					overlooked.</p>
				<p class="fade delayed delay1_5 center-txt">
					I
					want to capture them. In order to do that I ask, me into your world even if just
					for a
					brief moment.
				</p>
			</div>

			<div id="indicator" class="hbox centered-cross box-spacing-m align-end flex-one">
				<h2 id="indicator-text" class="fade-in-text font-size-xl font-weight-n">Welcome!</h2>
				<div class="vbox box-spacing-sm">
					<svg id="indicator-active" width="15" height="15"
						xmlns="http://www.w3.org/2000/svg">
						<ellipse cx="7.5" cy="7.5" rx="7.5" ry="7.5" />
					</svg>
					<svg class="collapsible" width="15" height="15" fill="none" stroke="black"
						xmlns="http://www.w3.org/2000/svg">
						<ellipse cx="7.5" cy="7.5" rx="7.5" ry="7.5" />
					</svg>
					<svg class="collapsible" width="15" height="15" fill="none" stroke="black"
						xmlns="http://www.w3.org/2000/svg">
						<ellipse cx="7.5" cy="7.5" rx="7.5" ry="7.5" />
					</svg>
				</div>
			</div>

		</div>
	</div>
	<script src="/index.js">
	</script>
</body>

</html>
